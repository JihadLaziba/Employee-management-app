# Les valeurs entre ${...:defaut} viennent des variables d'environnement (docker-compose).
# Les valeurs par défaut permettent de lancer le backend depuis IntelliJ
# pendant que PostgreSQL et MinIO tournent dans Docker.

server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: ems-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/ems_db}
    username: ${SPRING_DATASOURCE_USERNAME:ems_user}
    password: ${SPRING_DATASOURCE_PASSWORD:ems_password}

  jpa:
    hibernate:
      ddl-auto: validate        # Le schéma est géré par Flyway, Hibernate vérifie seulement
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

app:
  jwt:
    secret: ${JWT_SECRET:change-me-this-is-a-very-long-secret-key-for-jwt-signing-2026}
    # Durée de vie courte (5 min) : le frontend la renouvelle tant que l'utilisateur est actif.
    # Si l'utilisateur ferme l'application ou reste inactif, la session expire côté serveur.
    expiration-ms: ${JWT_EXPIRATION_MS:300000}

  cookie:
    name: ${AUTH_COOKIE_NAME:EMS_SESSION}
    secure: ${AUTH_COOKIE_SECURE:false}     # mettre true en production (HTTPS)

  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin123}
    bucket: ${MINIO_BUCKET:employees}

  super-admins:
    - name: ${SUPERADMIN1_NAME:Super Admin One}
      email: ${SUPERADMIN1_EMAIL:admin1@ems.com}
      password: ${SUPERADMIN1_PASSWORD:Admin@123}
    - name: ${SUPERADMIN2_NAME:Super Admin Two}
      email: ${SUPERADMIN2_EMAIL:admin2@ems.com}
      password: ${SUPERADMIN2_PASSWORD:Admin@123}
